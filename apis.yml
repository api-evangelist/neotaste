aid: neotaste
name: NeoTaste
description: >-
  NeoTaste is a restaurant discovery and dining-deals mobile app operated by
  NeoTaste GmbH (Osnabrück, Germany). Under the tagline "Discover more. Pay
  less." it surfaces curated local restaurants and exclusive member deals such
  as 2-for-1 main courses and a free starter with a main, letting diners try
  new places while saving money and helping restaurants attract new guests. The
  consumer product ships as native iOS and Android apps and currently operates
  across Germany, Austria, the Netherlands, and the United Kingdom. NeoTaste is
  a venture-backed (Series A) company surfaced through the Earlybird portfolio.
  It exposes no public developer API — its api.neotaste.com backend is a
  private, authentication-gated service for the first-party mobile apps — so
  this API Evangelist profile captures company identity, public web properties,
  and domain-security posture rather than an integration surface.
